[project]
name = "fits-here"
version = "0.1.0"
description = "Which new open-weights models fit this machine? Watches publishers on Hugging Face, sizes every GGUF build, and judges each against your GPU and system memory. Downloads nothing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yauhen Bichel" }]
requires-python = ">=3.11"
keywords = ["llm", "gguf", "hugging-face", "llama.cpp", "ollama", "self-hosted", "open-weights", "local-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = []            # the standard library is enough, on purpose

[project.scripts]
fits-here = "fits_here.cli:main"

[project.urls]
Homepage = "https://github.com/YauhenBichel/fits-here"
Issues = "https://github.com/YauhenBichel/fits-here/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fits_here"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
