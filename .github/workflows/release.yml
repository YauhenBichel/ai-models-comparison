name: release

# When a GitHub Release is published:
#   1. PyPI gets the package, with trusted publishing (OIDC): no API token is stored anywhere.
#   2. The MCP registry gets server.json, also with OIDC.
# Nothing here runs on a push or a pull request.
#
# One-time setup on pypi.org by the owner: add a pending publisher for project ai-models-comparison,
# owner YauhenBichel, repository ai-models-comparison, workflow release.yml, environment pypi.
# Until that exists the pypi job fails with PyPI's "invalid-publisher" error and nothing is published.
#
# Before publishing a release, the same version goes in three places, and the build job checks them against
# the tag: pyproject.toml, src/ai_models_comparison/__init__.py and server.json (twice).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: The tag matches the version in pyproject.toml, the package and server.json
        run: |
          version=$(uv version --short)
          fail() { echo "::error::$1"; exit 1; }
          test "v$version" = "$GITHUB_REF_NAME" || fail "tag $GITHUB_REF_NAME, pyproject.toml $version"
          grep -q "^__version__ = \"$version\"$" src/ai_models_comparison/__init__.py || fail "__init__.py is not $version"
          test "$(jq -r .version server.json)" = "$version" || fail "server.json version is not $version"
          test "$(jq -r '.packages[0].version' server.json)" = "$version" || fail "server.json package version is not $version"
      - name: Build sdist and wheel
        run: uv build
      - name: PyPI will accept the metadata and render the README
        run: uvx twine check --strict dist/*
      - name: The wheel installs, its command runs and the MCP server answers
        run: |
          uvx --from dist/*.whl ai-models-comparison --help
          test "$(uvx --from dist/*.whl ai-models-comparison --version)" = "ai-models-comparison ${GITHUB_REF_NAME#v}"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | uvx --from dist/*.whl ai-models-comparison mcp | grep -q '"judge_models"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/ai-models-comparison/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  registry:
    needs: pypi                    # the registry checks that the PyPI package exists
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
